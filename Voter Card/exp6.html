<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <h2 class="text-center">Voter Registration Form</h2>
    <form id="voterForm" action="#" method="POST" onsubmit="return validateForm()">
        <div class="form-group">
            <label for="name" class="form-label">Full Name:</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name">
            <span id="nameError" class="error-message">Please fill out this field.</span>
        </div>

        <div class="form-group">
            <label for="age" class="form-label">Age:</label>
            <input type="number" id="age" name="age" class="form-control" placeholder="Enter your age">
            <span id="ageError" class="error-message">Please fill out this field.</span>
        </div>

        <div class="form-group">
            <label for="email" class="form-label">Email:</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email">
            <span id="emailError" class="error-message">Please fill out this field.</span>
        </div>

        <div class="form-group">
            <label for="address" class="form-label">Address:</label>
            <input type="text" id="address" name="address" class="form-control" placeholder="Enter your address">
            <span id="addressError" class="error-message">Please fill out this field.</span>
        </div>

        <div class="form-group">
            <label for="dob" class="form-label">Date of Birth:</label>
            <input type="date" id="dob" name="dob" class="form-control">
            <span id="dobError" class="error-message">Please fill out this field.</span>
        </div>

        <div class="submit-btn">
            <button type="submit" class="button submit-btn">Register</button>
        </div>
    </form>
</div>

<!-- Success Popup -->
<div class="success-popup" id="successPopup">
    <div class="popup-content">
        <h3>Registration Successful!</h3>
        <p>Your form has been submitted successfully.</p>
        <button onclick="closePopup()">Close</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
